syntax = "proto3";
package kerthus.saas.v1;
option go_package = "kerthus/gen/go/saas/v1;saasv1";

service Platform {
 rpc Login(LoginRequest) returns (LoginReply);
 rpc Logout(Context) returns (Result);
 rpc Profile(Context) returns (User);
 rpc Auth(Context) returns (AuthReply);
 rpc Query(QueryRequest) returns (QueryReply);
 rpc Save(SaveRequest) returns (SaveReply);
 rpc Delete(DeleteRequest) returns (Result);
 rpc SetStatus(StatusRequest) returns (Result);
 rpc ChangePassword(PasswordRequest) returns (Result);
 rpc ApproveTenant(ApproveRequest) returns (Result);
 rpc SetEntitlements(EntitlementsRequest) returns (Result);
 rpc SetRoleResources(RoleResourcesRequest) returns (Result);
 rpc SetRoleMembers(RoleMembersRequest) returns (Result);
 rpc CheckAccess(AccessRequest) returns (AccessReply);
 rpc CreateUpload(UploadRequest) returns (UploadReply);
 rpc ConfirmUpload(ConfirmUploadRequest) returns (UploadReply);
 rpc ResolveDownload(FileRequest) returns (UploadReply);
 rpc CancelUpload(FileRequest) returns (Result);
 rpc Health(Empty) returns (Result);
}
message Empty {}
message Result { bool success=1; }
message Context { string token=1; int64 tenant_id=2; int64 app_id=3; int64 unit_id=4; int64 section_id=5; string request_id=6; }
message LoginRequest { string username=1; string password=2; string scene=3; }
message LoginReply { int64 user_id=1; string access_token=2; int64 expires_time=3; int64 tenant_id=4; int64 app_id=5; int64 unit_id=6; int64 section_id=7; string app_code=8; string home=9; }
message User { int64 id=1; string phone=2; string email=3; string name=4; string avatar=5; int32 sex=6; optional int32 status=7; int64 created_at=8; int64 updated_at=9; }
message Tenant { int64 id=1; string name=2; string logo=3; string contact_person=4; string contact_phone=5; string contact_email=6; string credit_code=7; string address_json=8; string address_detail=9; string description=10; optional int32 status=11; int32 verify_status=12; int64 expires_at=13; int64 created_at=14; string agent_provider=15; string agent_model=16; string agent_endpoint=17; string agent_api_key=18; bool agent_enabled=19; string agent_providers=20; }
message Member { User user=1; int64 tenant_id=2; int64 app_id=3; repeated int64 org_ids=4; repeated int64 position_ids=5; repeated Org orgs=6; repeated Position positions=7; optional int32 status=8; bool has_add=9; }
message Org { int64 id=1; int64 tenant_id=2; int64 parent_id=3; int64 unit_id=4; string type=5; string name=6; string short_name=7; optional int32 status=8; int32 sort=9; string remark=10; }
message Position { int64 id=1; int64 tenant_id=2; int64 org_id=3; string name=4; optional int32 status=5; string remark=6; string org_name=7; int64 created_at=8; int64 updated_at=9; }
message App { int64 id=1; string code=2; string name=3; string version=4; optional int32 status=5; string service_key=6; string route_prefix=7; string home=8; string frontend_entry=9; int64 expires_at=10; bool managed=11; string icon=12; string description=13; string remark=14; int64 tenant_app_id=15; string type=16; string url=17; bool is_public=18; }
message Resource { int64 id=1; int64 app_id=2; int64 parent_id=3; string code=4; string name=5; string type=6; string path=7; string component=8; string icon=9; string meta_json=10; optional int32 status=11; int32 sort=12; bool is_public=13; bool is_data_access=14; repeated Operation operations=15; string redirect=16; string remark=17; string open_with=18; }
message Operation { int64 id=1; int64 app_id=2; int64 resource_id=3; string operation_id=4; string method=5; string path=6; string group=7; string action=8; }
message Role { int64 id=1; int64 tenant_id=2; string code=3; string name=4; string remark=5; optional int32 status=6; bool administrator=7; repeated ResourceGrant grants=8; }
message ResourceGrant { int64 app_id=1; int64 resource_id=2; int32 data_scope=3; }
message TenantApp { int64 id=1; int64 tenant_id=2; int64 app_id=3; string tenant_name=4; string app_name=5; int64 expiration_time=6; repeated int64 resource_ids=7; int64 created_at=8; int64 updated_at=9; }
message District { int64 id=1; int64 parent_id=2; string name=3; bool has_children=4; }
message Audit { int64 id=1; int64 actor_id=2; int64 tenant_id=3; string action=4; int64 target_id=5; string request_id=6; int64 created_at=7; }
message AuthReply { repeated string roles=1; repeated string permissions=2; repeated Resource resources=3; LoginReply context=4; bool platform_admin=5; }
enum Kind { KIND_UNSPECIFIED=0; USERS=1; TENANTS=2; MEMBERS=3; ORGS=4; POSITIONS=5; APPS=6; RESOURCES=7; OPERATIONS=8; TENANT_APPS=9; ROLES=10; DISTRICTS=11; AUDITS=12; }
message QueryRequest { Context context=1; Kind kind=2; int64 id=3; int64 target_tenant_id=4; int64 target_app_id=5; int64 parent_id=6; int64 role_id=7; int32 page=8; int32 page_size=9; string search=10; string sort=11; bool desc=12; bool available_only=13; bool for_authorization=14; string name=15; string phone=16; int64 org_id=17; bool include_children=18; int64 created_from=19; int64 created_before=20; string code=21; string tenant_name=22; string app_name=23; bool tenant_apps_only=24; bool include_agent_credentials=25; }
message QueryReply { int64 total=1; repeated User users=2; repeated Tenant tenants=3; repeated Member members=4; repeated Org orgs=5; repeated Position positions=6; repeated App apps=7; repeated Resource resources=8; repeated Operation operations=9; repeated TenantApp tenant_apps=10; repeated Role roles=11; repeated District districts=12; repeated Audit audits=13; }
message SaveRequest { Context context=1; string password=2; oneof entity { User user=3; Tenant tenant=4; Member member=5; Org org=6; Position position=7; App app=8; Resource resource=9; Role role=10; } }
message SaveReply { int64 id=1; }
message DeleteRequest { Context context=1; Kind kind=2; int64 id=3; int64 target_tenant_id=4; }
message StatusRequest { Context context=1; Kind kind=2; int64 id=3; int32 status=4; int64 target_tenant_id=5; }
message PasswordRequest { Context context=1; int64 user_id=2; string old_password=3; string new_password=4; }
message ApproveRequest { Context context=1; int64 tenant_id=2; bool approved=3; string admin_password=4; }
message AppGrant { int64 app_id=1; int64 expires_at=2; repeated int64 resource_ids=3; }
message EntitlementsRequest { Context context=1; repeated int64 tenant_ids=2; repeated AppGrant apps=3; repeated int64 revoke_ids=4; }
message RoleResourcesRequest { Context context=1; int64 tenant_id=2; int64 role_id=3; repeated ResourceGrant grants=4; }
message RoleMembersRequest { Context context=1; int64 tenant_id=2; int64 role_id=3; repeated int64 user_ids=4; bool remove=5; }
message AccessRequest { Context context=1; string app_code=2; string method=3; string path=4; }
message AccessReply { int64 user_id=1; int64 tenant_id=2; int64 app_id=3; bool all_within_tenant=4; repeated int64 user_ids=5; string service_key=6; string route_prefix=7; }
message UploadRequest { Context context=1; string content_type=2; int64 size=3; string filename=4; bool private=5; }
message UploadReply { int64 id=1; string object_key=2; int64 max_size=3; string filename=4; string content_type=5; int64 size=6; bool private=7; }
message ConfirmUploadRequest { Context context=1; int64 id=2; }

message FileRequest { Context context=1; int64 id=2; string object_key=3; }
